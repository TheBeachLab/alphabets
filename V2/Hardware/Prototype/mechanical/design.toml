# Canonical direct dimensions for the V2 Prototype physical profile (millimetres).
# This is the 55 x 43 mm card and 50 x 80 mm Demo 64 sticker system.
# Derived dimensions are intentionally calculated in parameters.py.

[card]
body_width = 55.0
total_height = 43.0
tab_width = 4.0
tab_height = 3.0
thickness = 0.5
sticker_width = 50.0
sticker_face_height = 40.0
sticker_face_thickness = 0.1

[drum]
positions = 64
diameter = 85.0
side_thickness = 2.15
laser_kerf = 0.1
axial_clearance = 1.0
support_width = 35.0
support_tab_width = 6.0
support_y = 20.0
flap_hole_diameter = 3.0
# Radial clearance after the rectangular 0.5 mm-thick card tab is inscribed in
# the circular pivot hole. This permits free rotation, not merely insertion.
flap_rotation_clearance = 0.15
# The printed Prototype used a nominal 3 mm pivot hole with a rectangular
# 3 x 0.5 mm tab. Its corners theoretically exceed the circular hole by about
# 0.021 mm. Keep the measured Prototype contract instead of silently changing it.
allow_tab_interference = true
flap_hole_center_radius = 40.0
motor_axis_width = 3.0
motor_axis_height = 6.0
motor_axis_radius = 2.5
shaft_axis_radius = 1.7

[printed_spool]
thickness = 2.0
ring_width = 5.0
center_hub_radius = 6.5
shaft_pin_radius = 1.5
shaft_pin_height = 5.0

[motor]
chassis_radius = 14.0
chassis_height = 19.0
shaft_offset = 8.0
mount_outer_radius = 3.5
mount_hole_radius = 2.1
mount_center_offset = 17.5
mount_bracket_height = 0.8
shaft_collar_radius = 4.5
shaft_collar_height = 1.5
shaft_radius = 2.5
shaft_height = 10.0
shaft_flat_width = 3.0
shaft_flat_height = 6.0
backpack_width = 14.6
backpack_extent = 18.0
backpack_height = 16.0

[holder]
end_radius = 20.0
axis_radius = 5.0
length = 80.0
width = 40.0
end_tab_length = 10.0
thickness = 2.5
kerf = 0.2

[enclosure_reference]
left_width = 40.0
right_width = 60.0
upper_height = 60.0
lower_height = 75.0
reference_line_length = 41.5
upper_reference_start = 1.751
lower_reference_start = -2.11899

[drum_enclosure]
# Primary enclosure controls. Top, bottom and back are inner surfaces measured
# directly from the drum centre/axis. The front stays aligned to the saved
# front-card and pawl plane, so it has no manual offset.
top_distance = 63.0
bottom_distance = 72.0
back_distance = 63.0
side_clearance = 3.0
wall_thickness = 6.0
# Both full-side pockets enter this far from their outside faces. The remaining
# side wall is wall thickness minus this inset depth.
side_inset_depth = 4.0

capture_outer_corner_radius = 10.0
pawl_mount_land_margin = 2.0
docking_clearance = 0.3
side_pocket_chamfer = 4.0
side_pocket_margin = 6.0
side_pocket_corner_radius = 8.0
boss_end_chamfer = 1.5
electronics_card_width = 50.0
electronics_card_height = 35.0
# Movable electronics envelope. Negative Y moves it toward the back; Z is its
# height relative to the drum axis.
electronics_card_center_y = 0.0
electronics_card_center_z = -50.0
motor_bore_diameter = 10.0
shaft_bore_diameter = 3.4
motor_mount_hole_diameter = 4.4
shaft_support_axial_clearance = 0.5
shaft_support_boss_radius = 4.5
shaft_head_recess_diameter = 6.0
shaft_head_recess_depth = 2.0
motor_mount_disc_clearance = 0.5
motor_mount_boss_radius = 4.5
alignment_height = 3.0
alignment_base_size = 8.0
alignment_top_size = 2.0
alignment_clearance = 0.2
stack_alignment_x_inset = 14.0
stack_alignment_y_inset = 20.0
top_mark_character = "α"
top_mark_font_size = 90.0
top_mark_depth = 0.2
top_mark_chamfer = 0.2
top_mark_split_gap = 2.0
top_mark_rotation = 180.0
pawl_mount_width = 10.0
pawl_pilot_depth = 8.0
pawl_thickness_addition = 1.0
pawl_outer_chamfer = 0.0
pawl_tip_radius = 2.0
prototype_pawl_extension = 6.0
screw_clearance_diameter = 3.4
screw_pilot_diameter = 2.6
screw_head_diameter = 6.2
screw_head_depth = 2.0
